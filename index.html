  function hotelDetail(){const h=hotelById(state.detailId);if(!h)return empty('宿がありません','一覧に戻ってください。');const nearby=nearbyForHotel(h.id);return `<div class="page"><div class="page-head"><button class="back" data-action="nav" data-page="hotels" aria-label="宿の一覧に戻る">${svg('arrowLeft',23)}</button><div><h2>宿の詳細</h2><p class="sub">宿の近くの観光・体験を探す</p></div></div><img class="detail-cover" src="${image(h.image)}" alt="${esc(h.name)}のイメージ写真"/><h1 class="detail-title">${esc(h.name)}</h1><p class="detail-strap">${esc(h.area)} ・ ${esc(h.rating||'未取得')} ★ (${esc(h.reviews||'レビュー未取得')})</p><div class="detail-info">${(h.tags||[]).map(t=>`<span class="info-token">${esc(t)}</span>`).join('')}<span class="info-token">${h.isDemo?'デザイン確認用サンプル':'楽天トラベル掲載確認済'}</span></div><p style="color:#60738b;line-height:1.8">${esc(h.description||'宿の説明文は準備中です。')}</p><div class="detail-price">${esc(h.price||'料金は予約先で確認')} <small>${h.price?'/ 1泊・2名':'楽天トラベルで確認'}</small></div><div class="detail-actions"><button class="primary" data-action="booking" data-id="${esc(h.id)}">楽天トラベルで宿を探す ${svg('external',16)}</button><button class="secondary" data-action="favorite" data-id="${esc(h.id)}">${svg('heart',17,state.favorites.has(h.id)?'currentColor':'none')} ${state.favorites.has(h.id)?'保存済み':'お気に入り'}</button></div>${h.isDemo?'<p class="detail-hint">※施設名・料金・評価はサンプルです。上のボタンは実在する特定施設の予約ページではなく、楽天トラベルのトップページに移動します。</p>':'<p class="detail-hint">料金・空室・予約条件は、楽天トラベルのリンク先でご確認ください。</p>'}<h2 class="detail-section-title">この宿の近くで楽しむ</h2><p class="section-desc">この宿と関連づけられた観光地・体験を、近い順に紹介します。</p><div class="nearby-list">${nearby.length?nearby.map(({spot,link})=>`<button class="nearby-item" data-action="spot-detail" data-id="${esc(spot.id)}"><img src="${image(spot.image)}" alt=""/><span><strong>${esc(spot.name)}</strong><p>${esc(spot.description)}</p><span class="distance-label">宿から${Number(link.distance).toFixed(1)}km ${h.isDemo?'（表示例）':''}</span></span>${svg('chevron',19)}</button>`).join(''):empty('関連スポットは準備中です','登録でき次第、ここに表示します。')}</div></div>`;}
  function spotDetail(){const s=spotById(state.detailId);if(!s)return empty('スポットがありません','一覧に戻ってください。');const matches=hotelsForSpot(s.id);const saved=state.favorites.has(s.id);return `<div class="page"><div class="page-head"><button class="back" data-action="nav" data-page="spots" aria-label="観光・体験の一覧に戻る">${svg('arrowLeft',23)}</button><div><h2>観光・体験の詳細</h2><p class="sub">このスポットから、近くの宿を探す</p></div></div><img class="detail-cover" src="${image(s.image)}" alt="${esc(s.name)}のイメージ写真"/><h1 class="detail-title">${esc(s.name)}</h1><p class="detail-strap">${esc(s.type)} ${state.mode==='demo'?'・デザイン用サンプル':''}</p><div class="detail-info">${(s.tags||[]).map(t=>`<span class="info-token">${esc(t)}</span>`).join('')}</div><p style="color:#60738b;line-height:1.8">${esc(s.description)}</p><div class="detail-actions"><button class="secondary" data-action="favorite" data-id="${esc(s.id)}">${svg('heart',17,saved?'currentColor':'none')} ${saved?'保存済み':'お気に入り'}</button></div><h2 class="detail-section-title">このスポットの近くに泊まる</h2><p class="section-desc">楽天トラベル掲載の確認が取れた宿だけを紹介する構成です。</p><div class="nearby-list">${matches.length?matches.map(({hotel,link})=>`<button class="nearby-item linked-hotel" data-action="hotel-detail" data-id="${esc(hotel.id)}"><img src="${image(hotel.image)}" alt=""/><span><strong>${esc(hotel.name)}</strong><p>${esc(hotel.area)}</p><span class="distance-label">このスポットから${Number(link.distance).toFixed(1)}km ${hotel.isDemo?'（表示例）':''}</span></span>${svg('chevron',19)}</button>`).join(''):empty('近くの宿がありません','紐づく楽天トラベル掲載宿が確認でき次第表示します。')}</div><p class="detail-hint">${state.mode==='demo'?'※このページのスポット・宿と距離は表示イメージです。':'※距離は施設間の直線距離の参考表示です。'}</p></div>`;}
  function render(){const main=document.getElementById('main');const detail=state.page==='hotel-detail'||state.page==='spot-detail';main.innerHTML=state.page==='home'?home():state.page==='search'?searchPage():state.page==='hotels'?hotelsPage():state.page==='spots'?spotsPage():state.page==='favorites'?favoritesPage():state.page==='profile'?profilePage():state.page==='hotel-detail'?hotelDetail():state.page==='spot-detail'?spotDetail():home();main.classList.toggle('app-main-home',state.page==='home');document.getElementById('bottomNav').innerHTML=NAV.map(([id,label,ico])=>`<button class="${(detail?(state.page==='hotel-detail'?'hotels':'spots'):(state.page==='search'?'hotels':state.page))===id?'active':''}" data-action="nav" data-page="${id}" aria-label="${label}">${svg(ico,24)}<span>${label}</span></button>`).join('');document.getElementById('desktopNav').innerHTML=NAV.map(([id,label])=>`<button class="${(detail?(state.page==='hotel-detail'?'hotels':'spots'):(state.page==='search'?'hotels':state.page))===id?'active':''}" data-action="nav" data-page="${id}">${label}</button>`).join('');document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=svg(el.dataset.icon,24));}
  function closeMenu(){document.getElementById('overlayRoot').innerHTML='';}
  function showMenu(){document.getElementById('overlayRoot').innerHTML=`<div class="overlay" data-action="close-menu"><aside class="drawer" role="dialog" aria-label="メニュー"><button class="drawer-close" data-action="close-menu" aria-label="閉じる">×</button><img src="${image('logo.png')}" width="62" height="62" alt=""/><h2>そらたび</h2>${NAV.map(([id,label])=>`<button data-action="nav" data-page="${id}">${label}　›</button>`).join('')}<button data-action="rakuten">楽天トラベルを開く　↗</button><div class="info">${state.mode==='demo'?'※この版はデザイン用サンプルデータで動いています。実際の施設・価格の取得は未接続です。':'楽天トラベル掲載確認済みデータで表示しています。'}</div></aside></div>`;}
  document.addEventListener('click',(e)=>{const el=e.target.closest('[data-action]');if(!el)return;const type=el.dataset.action;const id=el.dataset.id;e.preventDefault();e.stopPropagation();if(type==='home')go('home',{query:'',chip:''});if(type==='nav')go(el.dataset.page,{query:'',chip:''});if(type==='hotel-detail')go('hotel-detail',{id});if(type==='spot-detail')go('spot-detail',{id});if(type==='favorite')saveFav(id);if(type==='chip')go(el.dataset.chip==='体験'?'spots':'hotels',{chip:el.dataset.chip,query:''});if(type==='toggle-chip'){state.chip=state.chip===el.dataset.chip?'':el.dataset.chip;render();}if(type==='clear-chip'||type==='reset'){state.chip='';state.query='';render();}if(type==='feature')go(el.dataset.chip==='体験'?'spots':'hotels',{chip:el.dataset.chip,query:''});if(type==='menu')showMenu();if(type==='close-menu')closeMenu();if(type==='notification')toast('現在、お知らせはありません。');if(type==='booking'){const h=hotelById(id);const url=validBooking(h?.rakutenUrl)?h.rakutenUrl:RAKUTEN_TOP;window.open(url,'_blank','noopener,noreferrer');}if(type==='rakuten')window.open(RAKUTEN_TOP,'_blank','noopener,noreferrer');});
  document.addEventListener('submit',(e)=>{if(!['heroSearch','pageSearch'].includes(e.target.id))return;e.preventDefault();const q=new FormData(e.target).get('q')?.toString()||'';state.query=q;state.chip='';if(e.target.id==='heroSearch')go('search',{query:q,chip:''});else render();});
  document.addEventListener('change',e=>{if(e.target.id==='hotelSort'){state.sort=e.target.value;render();}});
  // Verified external dataset: every hotel must explicitly pass the Rakuten listing check.
  // Spots without links to one of those approved hotels are never displayed.
  async function loadVerifiedData(){try{const r=await fetch('data/places.json',{cache:'no-store'});if(!r.ok)return;const data=await r.json();const hotels=(Array.isArray(data.hotels)?data.hotels:[]).filter(h=>h.verifiedRakuten===true&&validBooking(h.rakutenUrl)&&typeof h.id==='string'&&h.name).map(h=>({...h,isDemo:false,image:h.image||'hero.jpg'}));if(!hotels.length)return;const good=new Set(hotels.map(h=>h.id));const distKm=(a,b,c,d)=>{const toRad=v=>v*Math.PI/180;const deltaLat=toRad(c-a),deltaLng=toRad(d-b);const x=Math.sin(deltaLat/2)**2+Math.cos(toRad(a))*Math.cos(toRad(c))*Math.sin(deltaLng/2)**2;return 6371*2*Math.asin(Math.min(1,Math.sqrt(x)));};const spots=(Array.isArray(data.spots)?data.spots:[]).filter(s=>s.verifiedPlace===true).map(s=>{const links=hotels.map(h=>{const direct=(Array.isArray(s.links)?s.links:[]).find(l=>l.hotelId===h.id);let distance=direct?.distance;if([s.lat,s.lng,h.lat,h.lng].every(v=>Number.isFinite(Number(v)))&&[s.lat,s.lng,h.lat,h.lng].every(v=>v!==null&&v!==''&&v!==undefined)){distance=distKm(Number(s.lat),Number(s.lng),Number(h.lat),Number(h.lng));}return {hotelId:h.id,distance:Number(distance)};}).filter(l=>good.has(l.hotelId)&&Number.isFinite(l.distance)&&l.distance>=0&&l.distance<=25).sort((a,b)=>a.distance-b.distance);return {...s,links};}).filter(s=>s.id&&s.name&&s.links.length).map(s=>({...s,image:s.image||'scenic_fujisan.jpg'}));state.hotels=hotels;state.spots=spots;state.mode='verified';render();}catch(err){/* Local-file preview works with bundled sample content. */}}
  render();loadVerifiedData();
  if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js').catch(()=>{}));}
 })();
 </script>
